[package]
name = "datei-browser"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
tokio = { version = "=1.40.0", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "process", "signal", "sync", "time"] }
axum = { version = "=0.7.9", features = ["multipart"] }
tokio-util = { version = "=0.7.12", features = ["io"] }
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
rand = "=0.8.5"

[profile.release]
opt-level = 3
